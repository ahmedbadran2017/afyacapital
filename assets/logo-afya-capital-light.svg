<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Afya Capital Logo — Light/White version for dark backgrounds -->

  <!-- Hexagon Mark -->
  <path d="M30 3L52 14.5V37.5L30 49L8 37.5V14.5L30 3Z" fill="#0d1f35" stroke="#c8963e" stroke-width="1.2"/>

  <!-- Letter A (gold) -->
  <path d="M20 39L30 15L40 39" stroke="#c8963e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M23 31H37" stroke="#c8963e" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Medical Cross (teal) -->
  <path d="M30 20V26M27 23H33" stroke="#14a892" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Dot accent -->
  <circle cx="30" cy="43" r="1.5" fill="#c8963e"/>

  <!-- Text: AFYA (white) -->
  <text x="68" y="29" font-family="Alexandria, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.02em">Afya</text>

  <!-- Text: CAPITAL (gold) -->
  <text x="130" y="29" font-family="Alexandria, sans-serif" font-size="26" font-weight="700" fill="#c8963e" letter-spacing="0.02em">Capital</text>

  <!-- Tagline -->
  <text x="68" y="44" font-family="Alexandria, sans-serif" font-size="8.5" font-weight="500" fill="#14a892" letter-spacing="0.25em">HEALTHCARE INVESTMENT</text>
</svg>
